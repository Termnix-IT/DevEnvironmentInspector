[workspace]
members = ["crates/core", "crates/scanner", "crates/mcp-server", "apps/desktop/src-tauri"]
default-members = ["crates/core", "crates/scanner", "crates/mcp-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
inspector-core = { path = "crates/core" }
inspector-scanner = { path = "crates/scanner" }
rmcp = { version = "3.6.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "serde-well-known"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "process", "io-util", "time"] }
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "job-object", "creation-flags", "kill-on-drop", "process-group"] }

[workspace.lints.rust]
unsafe_code = "forbid"
