[package]
name = "inspector-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
inspector-core.workspace = true
inspector-scanner.workspace = true
serde.workspace = true
tauri = { version = "2.12.5", default-features = false, features = ["wry", "compression", "common-controls-v6"] }
tauri-plugin-dialog = { version = "2.8.3", default-features = false }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
time.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "dei-desktop"
path = "src/main.rs"

[lints]
workspace = true
